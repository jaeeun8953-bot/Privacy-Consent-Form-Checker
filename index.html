<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인정보 동의서 점검</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#182739;font:15px/1.6 system-ui,sans-serif}header{background:#12263c;color:white;border-bottom:4px solid #44b9a8}main,.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.wrap{padding:42px 0 32px}h1{font-size:clamp(29px,5vw,50px);line-height:1.15;margin:0 0 12px;letter-spacing:-.06em}header p{margin:0;color:#d3e3ef}main{padding:26px 0 40px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}section{padding:22px;border:1px solid #dbe2eb;border-radius:16px;background:white;min-width:0}h2{font-size:20px;margin:0 0 10px}p{margin:8px 0}textarea{width:100%;padding:14px;min-height:315px;resize:vertical;font:inherit;border:1px solid #aab9cb;border-radius:8px;background:#fbfcfe;color:inherit}button,.upload{display:inline-block;font:inherit;cursor:pointer;border:1px solid #bac7d6;background:white;border-radius:8px;padding:8px 12px;color:inherit}button:focus-visible,.upload:focus-within,textarea:focus-visible{outline:3px solid #329c91;outline-offset:2px}button[aria-pressed="true"]{background:#e3f5f1;border-color:#26897d;font-weight:700}.primary{background:#155a54;color:white;border-color:#155a54;font-weight:700}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.muted,small{color:#52647c}small{display:block}article{margin-top:12px;border:1px solid #dce4ed;border-left:3px solid #b46a1a;border-radius:8px;padding:12px;overflow-wrap:anywhere}article.high{border-left-color:#a74234}blockquote{margin:8px 0;padding:8px 10px;background:#f2f5f9;border-radius:5px;white-space:pre-wrap}a{color:#245481}.hidden{position:absolute;width:1px;height:1px;opacity:0}.footer{grid-column:1/-1;margin:0}.tag{font-size:12px;color:#803d15;background:#fcebdd;border-radius:20px;padding:2px 8px;margin-right:6px}#status{min-height:24px}@media(max-width:760px){main{grid-template-columns:1fr}.wrap{padding:28px 0}section{padding:16px}}
</style>
<header><div class="wrap"><h1>개인정보 동의서 점검</h1><p>빠진 고지 항목과 추가로 검토할 표현을 찾습니다.</p></div></header>
<main>
<section aria-labelledby="input-title">
<h2 id="input-title"><label for="source">동의서 원문</label></h2>
<small>기존 방식은 브라우저 안에서 처리합니다. 앱은 입력 내용을 자동 저장하지 않습니다.</small>
<div class="actions"><button id="example">샘플 불러오기</button><label class="upload">TXT 열기<input class="hidden" id="file" type="file" accept=".txt,text/plain" aria-label="TXT 열기"></label></div>
<textarea id="source" maxlength="100000" placeholder="동의서의 제목과 본문을 붙여 넣으세요." spellcheck="false"></textarea>
<div class="actions"><button class="primary" id="run">기존 방식 실행</button><button id="gpt">GPT 방식 실행</button><button id="clear">초기화</button></div>
<small id="gpt-note">GPT 방식은 실행 버튼을 눌렀을 때 원문을 OpenAI API로 전송합니다. 실제 개인을 식별할 수 있는 값은 지우고 실행하세요.</small>
<p id="status" role="status" class="muted"></p>
</section>
<section aria-labelledby="output-title">
<h2 id="output-title">검토 결과</h2>
<div class="actions" role="group" aria-label="결과 보기"><button id="rules-view" aria-pressed="true">기존 방식</button><button id="gpt-view" aria-pressed="false">GPT 방식</button></div>
<p id="summary" role="status" class="muted">동의서를 입력하면 검토 항목과 해당 문구가 표시됩니다.</p>
<button id="save" disabled>결과 TXT 저장</button>
<div id="results"></div>
</section>
<p class="footer muted">기존 방식은 규칙으로, GPT 방식은 문맥을 바탕으로 점검합니다. 결과는 사람이 원문과 실제 동의 화면을 함께 검토할 때 참고하세요. <a href="https://www.law.go.kr/법령/개인정보보호법" target="_blank" rel="noopener noreferrer">개인정보 보호법 원문</a></p>
</main>
<script>
'use strict';
const sample = `[개인정보 수집·이용 동의]
수집 항목: 이름, 연락처, 건강정보
이용 목적: 상담 신청 접수
보유 기간: 영구 보관
회신이 없으면 동의한 것으로 간주합니다.

[개인정보 제3자 제공 동의]
제공받는 자: 제휴사
제공 항목: 연락처

만 14세 미만 아동도 직접 동의할 수 있습니다.`;
const purpose = /(?:수집\s*[·ㆍ･•/및·]?\s*)?이용\s*목적\s*[:：|]\s*[^\s|]|목적(?:은|으로)\s*[^\s]/;
const items = /(?:수집|제공|개인정보)\s*항목\s*[:：|]\s*[^\s|]|(?:이름|성명|연락처|이메일|주소).{0,45}(?:수집합니다|제공합니다)/;
const retention = /(?:보유|이용|보관)(?:\s*[·ㆍ/및]+\s*이용)?\s*기간\s*[:：|]\s*[^\s|]|(?:\d+\s*(?:일|개월|년)|탈퇴\s*시까지|목적\s*달성\s*시까지).{0,20}(?:보관|보유|파기)/;
const refusal = /동의(?:를|의)?\s*(?:하지\s*않을\s*권리|거부할\s*(?:수|권리)|거부\s*권리)|동의하지\s*않으셔도/;
const impact = /불이익(?:의\s*내용)?\s*[:：|]\s*[^\s|]|(?:불이익|제한)(?:이|은|을)?\s*(?:없|있|받|될)|(?:신청|이용|가입)이\s*(?:제한|불가)|동의\s*거부\s*시\s*불이익\s*없/;
const recipient = /(?:제공받는\s*(?:자|곳|기관)|제공\s*대상)\s*[:：|]\s*[^\s|]/;
const thirdPurpose = /(?:제공\s*목적|(?:제공받는\s*자(?:의)?\s*)?(?:개인정보\s*)?이용\s*목적)\s*[:：|]\s*[^\s|]/;
function analyze(input) {
  const lines = input.normalize('NFKC').split(/\r?\n/).map((value, index) => ({value:value.trim(), number:index+1})).filter(line => line.value);
  const checks = [];
  const add = (title, detail, law, line, high=false) => checks.push({title, detail, law, line, high});
  const scopes = [];
  let current;
  for (const line of lines) {
    const value = line.value;
    const heading = value.length <= 85 && !/[:：]/.test(value);
    const collect = /수집\s*(?:[·ㆍ･•/,]|및)?\s*이용|수집\s*동의/.test(value);
    const provide = /제\s*3\s*자.{0,22}(?:제공|공유)/.test(value);
    if (heading && (collect || provide || /^(?:\[|#{1,6}\s|제\s*\d+\s*조)/.test(value))) {
      const kind = collect && provide ? 'combined' : provide ? 'third' : collect ? 'collect' : 'other';
      current = {kind, lines: []};
      scopes.push(current);
    }
    if (!current) {
      current = {kind:'unknown', lines:[]};
      scopes.push(current);
    }
    current.lines.push(line);
  }
  let evaluated = 0;
  for (const scope of scopes) {
    const section = scope.lines.map(line => line.value).join('\n');
    const anchor = scope.lines[0];
    let {kind} = scope;
    if (kind === 'unknown' || kind === 'other') {
      const hasThird = /제\s*3\s*자.{0,22}(?:제공|공유)|제공받는\s*자/.test(section);
      const hasCollect = /수집\s*[·ㆍ･•/,]?\s*이용|수집\s*항목|수집\s*목적/.test(section);
      kind = hasThird && hasCollect ? 'combined' : hasThird ? 'third' : hasCollect ? 'collect' : 'other';
    }
    if (kind === 'other') continue;
    if (kind === 'combined') {
      add('수집·이용과 제3자 제공 동의 구분 확인','두 절차의 고지 내용과 동의 선택란을 각각 확인하세요. 제목을 나눠 입력하면 절별 고지 항목을 점검할 수 있습니다.','제22조',anchor,true);
      continue;
    }
    evaluated++;
    const third = kind === 'third';
    const fields = [[third ? thirdPurpose : purpose,'이용 목적'],[items,third?'제공하는 개인정보 항목':'수집하는 개인정보 항목'],[retention,third?'제공받는 자의 보유·이용 기간':'보유·이용 기간'],[refusal,'동의 거부 권리'],[impact,'거부 시 불이익이 있는 경우 그 내용']];
    if (third) fields.unshift([recipient,'제공받는 자']);
    const missing = fields.filter(([pattern]) => !pattern.test(section)).map(([,label]) => label);
    const law = third ? '제17조 제2항' : '제15조 제2항';
    if (missing.length) add(third?'제3자 제공 고지 확인':'수집·이용 고지 확인',missing.join(', ') + ' 항목을 이 구역에서 확인하기 어렵습니다. 표와 다른 안내 문구를 함께 확인하세요.',law,anchor);
    if (third) {
      const vague = scope.lines.find(line => /(?:제공받는\s*(?:자|곳|기관)|제공\s*대상)\s*[:：|]\s*(?:제휴사|협력사|관계사|파트너사)(?:\s*등)?[.。]?\s*$/.test(line.value));
      if (vague) add('제공 대상이 포괄적으로 기재됨','정보를 제공받는 주체를 문서에서 식별할 수 있는지 확인하세요.',law,vague);
    }
  }
  const whole = lines.map(line => line.value).join('\n');
  for (const line of lines) {
    const value = line.value;
    if (/(?:미응답|회신이\s*없|응답이\s*없|별도\s*의사.{0,10}없|거부하지\s*않|가입\s*시).{0,50}동의.{0,12}(?:간주|봅니다|처리)/.test(value) && !/(?:간주|처리)하지\s*않|간주하지\s*않/.test(value)) add('동의 간주 표현','정보주체가 동의 내용을 확인하고 직접 선택할 수 있는지 실제 화면이나 절차에서 확인하세요.','제22조',line,true);
    if (/영구\s*(?:보관|보유)|무기한\s*(?:보관|보유)|필요\s*시까지/.test(value) && !/(?:보관|보유)하지\s*않/.test(value)) add('불명확하거나 장기인 보유 기간','구체적인 보유 기간 또는 종료 조건과 적용 근거를 확인하세요.','제15조·제17조',line);
  }
  const find = pattern => lines.find(line => pattern.test(line.value));
  const child = find(/(?:만\s*)?14\s*세\s*미만|아동.{0,12}개인정보/);
  if (child && !/14\s*세\s*미만.{0,20}(?:가입|이용)(?:이|을)?\s*(?:불가|제한|할\s*수\s*없)/.test(child.value)) {
    const representative = /법정\s*대리인(?:의)?\s*동의/.test(whole);
    const confirmation = /본인\s*확인|동의\s*(?:여부|사실)\s*(?:를\s*)?확인|동의하였는지\s*확인/.test(whole);
    if (!representative || !confirmation || /직접\s*동의|대리인.{0,15}없이/.test(child.value)) add('만 14세 미만 아동 동의 절차 확인','동의가 필요한 경우 법정대리인의 동의를 받고 동의 여부를 확인하는 절차를 검토하세요.','제22조의2',child,true);
  }
  const sensitive = find(/민감\s*정보|건강\s*정보|진료\s*기록|유전\s*정보/);
  if (sensitive) add('민감정보 처리 확인','동의에 근거해 처리한다면 다른 개인정보 처리 동의와 구분된 동의가 있는지 확인하세요. 법령상 근거가 있다면 해당 근거를 확인하세요.','제23조',sensitive);
  const unique = find(/고유\s*식별\s*정보|외국인등록번호|여권\s*번호|운전면허\s*번호/);
  if (unique) add('고유식별정보 처리 확인','동의에 근거해 처리한다면 다른 개인정보 처리 동의와 구분된 동의가 있는지 확인하세요.','제24조',unique);
  const resident = find(/주민\s*등록\s*번호/);
  if (resident) add('주민등록번호 처리 근거 확인','주민등록번호 처리에 적용되는 법률상 허용 사유와 실제 수집 여부를 검토하세요.','제24조의2',resident,true);
  return {evaluated, checks: checks.sort((a,b) => Number(b.high)-Number(a.high) || a.line.number-b.line.number)};
}
const $ = id => document.getElementById(id);
const source = $('source');
let view = 'rules';
let results = {};
let pending = null;
const gptAvailable = location.protocol === 'http:' && location.hostname === '127.0.0.1';
if (!gptAvailable) $('gpt-note').textContent += ' GPT 방식은 ZIP에 포함된 실행 파일로 열어 주세요.';
let inputVersion = 0;
function resetResult() {
  inputVersion++;
  pending?.abort();
  pending = null;
  results = {};
  render();
  $('status').textContent = '';
}
function setInput(value) {
  source.value = value;
  resetResult();
}
source.addEventListener('input', resetResult);
$('example').onclick = () => setInput(sample);
$('clear').onclick = () => {setInput(''); source.focus();};
$('file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const version = ++inputVersion;
  try {
    if (file.size > 400003) throw new Error('파일이 너무 큽니다. 최대 100,000자까지 점검할 수 있습니다.');
    const value = new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());
    if (value.length > source.maxLength || value.includes('\0')) throw new Error('100,000자 이내의 UTF-8 TXT 파일을 열어 주세요.');
    if (version !== inputVersion) return;
    setInput(value);
    $('status').textContent = 'TXT 파일을 불러왔습니다.';
  } catch (error) {
    if (version === inputVersion) $('status').textContent = error instanceof TypeError ? 'UTF-8로 저장한 TXT 파일을 열어 주세요.' : error.message;
  }
};
function append(parent, tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  parent.append(element);
  return element;
}
function render() {
  const result = results[view];
  $('rules-view').setAttribute('aria-pressed', String(view === 'rules'));
  $('gpt-view').setAttribute('aria-pressed', String(view === 'gpt'));
  $('results').replaceChildren();
  $('save').disabled = !result?.report;
  $('gpt').disabled = Boolean(pending);
  $('summary').textContent = result?.message ?? (view === 'rules' ? '기존 방식 실행을 누르면 규칙 기반 결과가 표시됩니다.' : 'GPT 방식 실행을 누르면 문맥 기반 검토 결과가 표시됩니다.');
  for (const check of result?.checks ?? []) {
    const card = document.createElement('article');
    card.className = check.high ? 'high' : '';
    append(card,'span',check.high?'우선 검토':'확인 필요','tag');
    append(card,'strong',check.title);
    append(card,'p',check.detail);
    append(card,'blockquote',check.line.number + '행 · ' + check.line.value);
    append(card,'small','개인정보 보호법 ' + check.law);
    $('results').append(card);
  }
  if (result?.review) append($('results'), 'blockquote', result.review);
}
function selectView(mode) {
  view = mode;
  render();
}
$('rules-view').onclick = () => selectView('rules');
$('gpt-view').onclick = () => selectView('gpt');
function hasInput() {
  $('status').textContent = '';
  if (source.value.trim()) return true;
  $('status').textContent = '점검할 동의서를 입력해 주세요.';
  source.focus();
  return false;
}
$('run').onclick = () => {
  if (!hasInput()) return;
  const {checks,evaluated} = analyze(source.value);
  const message = checks.length ? '검토 항목 ' + checks.length + '건' : '설정된 규칙에서 추가 검토 항목이 발견되지 않았습니다.';
  const coverage = evaluated ? '고지 항목을 점검한 구역 ' + evaluated + '개' : '수집·이용 또는 제3자 제공 구역을 개별 점검하지 못했습니다.';
  const report = ['개인정보 동의서 점검 · 기존 방식', message, coverage, ...checks.map(check => [check.title,check.detail,check.line.number+'행 · '+check.line.value,'개인정보 보호법 '+check.law].join('\n'))].join('\n\n');
  results.rules = {message: message + ' · ' + coverage, checks, report};
  selectView('rules');
};
$('gpt').onclick = async () => {
  if (!hasInput() || pending) return;
  if (!gptAvailable) {
    results.gpt = {message:'ZIP을 풀고 GPT 실행 파일로 앱을 열어 주세요.'};
    selectView('gpt');
    return;
  }
  const request = new AbortController();
  pending = request;
  results.gpt = {message:'GPT가 원문을 검토하고 있어요…'};
  selectView('gpt');
  try {
    const response = await fetch('/api/review', {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:request.signal,
      body:JSON.stringify({document:source.value})
    });
    const data = await response.json();
    if (pending !== request) return;
    if (!response.ok || typeof data.review !== 'string') throw new Error(data.error || 'GPT 응답을 읽을 수 없습니다.');
    results.gpt = {message:'GPT 검토 완료 · ' + data.model, review:data.review, report:'개인정보 동의서 점검 · GPT 방식 (' + data.model + ')\n\n' + data.review};
  } catch (error) {
    if (pending !== request) return;
    results.gpt = {message:error instanceof TypeError ? '로컬 실행 창이 열려 있는지 확인해 주세요.' : error.message};
  } finally {
    if (pending === request) {
      pending = null;
      render();
    }
  }
};
$('save').onclick = () => {
  const report = results[view]?.report;
  if (!report) return;
  const url = URL.createObjectURL(new Blob(['\uFEFF',report],{type:'text/plain;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'consent-review-' + view + '.txt';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};
</script>
</html>
